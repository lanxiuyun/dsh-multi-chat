# dsh-multi-chat bundle patch: inserts the plugin row into the web profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:<path-to-this-package>` (or by adding
# the package to `dsh.profile.bundles`), then restart the profile.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process and is intentionally inert, while the `dsh.client`
# declaration in package.json makes the browser half (exports "./client",
# served at /plugins/dsh-multi-chat/client.js) load in the web GUI, where all
# of the behavior lives.
- insert:
    - id: dsh-multi-chat
      name: dsh-multi-chat
